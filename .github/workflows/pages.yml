name: Deploy update feed (Pages)

# Serves the static self-update feed at https://updates.fullobby.com from the
# feed/ folder on main. Replaces the old orphan gh-pages branch. Manifests
# (latest.json / latest-beta.json) are hand-published into feed/ by the
# maintainer; see feed/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'feed/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two feed deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed
      - id: deployment
        uses: actions/deploy-pages@v4
