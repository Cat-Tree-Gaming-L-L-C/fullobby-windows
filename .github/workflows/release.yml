name: Release

# Tag-driven release: push a semver tag (e.g. `v1.2.3`, or `v1.2.3-beta.1` for a
# prerelease) and this builds + tests, publishes the self-contained app, builds the
# Inno installer, optionally code-signs it, computes the SHA-256, and creates a
# GitHub Release with the installer, its checksum, and an update manifest.
#
# The manifest (latest.json / latest-beta.json) matches the shape the in-app updater
# reads from the static update feed (UpdaterService → UpdateConfig.FeedBaseUrl,
# https://updates.comp-hll.org): { version, download_url, notes, sha256, signature }.
# The feed is a GitHub Pages site — deliberately NOT the API, so the backend is never in a
# position to strip the pinned-key signature. `version` is the full SemVer (incl. any
# `-beta.N`) so beta→beta updates order correctly. download_url is the GitHub release asset
# on github.com, which is in the updater's trusted-domain allowlist.
#
# RELEASE SIGNING (`signature`): the in-app updater MANDATES a pinned-key ECDSA P-256
# signature over (version, sha256). The signing private key is held OFFLINE (air-gapped
# Pi) and intentionally never reaches CI, so this workflow emits the manifest with
# `signature: null` plus a `<manifest>.payload.txt` asset (the exact bytes to sign) as
# release assets. A maintainer signs it offline, finalizes the manifest (runbook + scripts
# in the private chll-seeding-api repo), and publishes the signed manifest to the Pages feed.
# Until that happens the (unsigned or not-yet-published) manifest is REFUSED by clients —
# the failure mode is "no auto-update", never "unverified update".

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tag object for the annotation message

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v',''            # 1.2.3  or  1.2.3-beta.1 (full SemVer)
          $pre = if ($ver.Contains('-')) { 'true' } else { 'false' }
          $manifest = if ($pre -eq 'true') { 'latest-beta.json' } else { 'latest.json' }
          "VERSION=$ver"                          >> $env:GITHUB_ENV
          "IS_PRERELEASE=$pre"                    >> $env:GITHUB_ENV
          "MANIFEST_NAME=$manifest"               >> $env:GITHUB_ENV
          "INSTALLER=CHLL-Seeding-Setup-$ver.exe" >> $env:GITHUB_ENV
          Write-Host "Releasing $tag -> version $ver (prerelease: $pre)"

      - name: Configure signing
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          # Code-signing is optional: it runs only when WINDOWS_CERT_BASE64 (+ password)
          # secrets are configured, so the workflow still produces an (unsigned) release
          # before a cert is set up.
          if ($env:CERT) { "HAS_CERT=true" >> $env:GITHUB_ENV } else { "HAS_CERT=false" >> $env:GITHUB_ENV }

      - name: Restore
        run: dotnet restore src/ChllSeeding.sln

      - name: Build (Release)
        run: dotnet build src/ChllSeeding.sln -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test src/ChllSeeding.Core.Tests -c Release --no-build

      - name: Publish app (win-x64, self-contained)
        run: >-
          dotnet publish src/ChllSeeding.App -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:Version=${{ env.VERSION }} -o artifacts/publish

      - name: Sign app executable
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 -File artifacts/publish/CHLLSeeding.exe

      - name: Build installer (Inno Setup)
        run: iscc /DAppVersion=${{ env.VERSION }} installer\ChllSeeding.iss

      - name: Sign installer
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 -File "installer/Output/$env:INSTALLER"

      - name: Checksum + update manifest
        shell: pwsh
        run: |
          $file = "installer/Output/$env:INSTALLER"
          if (-not (Test-Path $file)) { throw "Installer not found at $file" }

          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  $env:INSTALLER" | Out-File -Encoding ascii "${file}.sha256"

          $download = "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/$env:INSTALLER"

          # Release notes for the manifest come from the annotated tag message (if any).
          $notes = (git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n"
          if (-not $notes) { $notes = "" }

          # signature stays null here — the release-signing private key is held OFFLINE and never
          # touches CI. An enforcing client REFUSES a null-signature manifest, so until the operator
          # signs it offline, finalizes the manifest (runbook + scripts in the private chll-seeding-api
          # repo), and publishes it to the Pages feed, this release simply will not auto-update anyone.
          # Safe failure mode. (version is the full SemVer, so the signed payload matches the manifest.)
          $manifest = [ordered]@{
            version      = $env:VERSION
            download_url = $download
            notes        = $notes.Trim()
            sha256       = $hash
            signature    = $null
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $manifest | ConvertTo-Json | Out-File -Encoding utf8 "dist/$env:MANIFEST_NAME"

          # Canonical payload the offline signer must sign — must match UpdateSignature.BuildSignedPayload
          # (LF separators, lowercase sha256, no trailing newline). Emitted as a release asset + job
          # summary so the operator can copy it to the air-gapped Pi.
          $payload = "chll-seeding-update.v1`nversion=$env:VERSION`nsha256=$hash"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/$env:MANIFEST_NAME.payload.txt"), $payload)

          Write-Host "SHA-256: $hash"
          Get-Content "dist/$env:MANIFEST_NAME"
          "## Release signing payload" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "Sign this on the offline Pi — ``sign-release.sh $env:VERSION $hash`` (chll-seeding-api repo):" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```'    | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $payload | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```'    | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CHLL Seeding ${{ env.VERSION }}
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer/Output/${{ env.INSTALLER }}
            installer/Output/${{ env.INSTALLER }}.sha256
            dist/${{ env.MANIFEST_NAME }}
            dist/${{ env.MANIFEST_NAME }}.payload.txt
